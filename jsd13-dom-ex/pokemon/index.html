<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokemon</title>
    <link rel="stylesheet" href="stylesheet.css" />
</head>
<body>
    <div class="card">
        <h1 class="page-title">Search Pokemon!</h1>
        <div class="input-group">
            <input type="text" id="pokemonInput" placeholder="Enter Pokemon..." />
        </div>
        <div class="button-group">
            <button id="findPokemon">Find Pokemon</button>
            <button id="randomPokemon">Random</button>
            <button id="resetPokemon">Reset</button>
        </div>
        <div id="progressX"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
